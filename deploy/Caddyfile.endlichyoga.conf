# BEGIN ENDLICHYOGA (managed via deploy/provision.sh — do not edit by hand)
deploy.endlichyoga.de {
	log
	reverse_proxy 127.0.0.1:18794
}

endlichyoga.de, www.endlichyoga.de {
	log
	root * /opt/http/endlichyoga.de
	encode zstd gzip
	@static path *.css *.js *.png *.jpg *.jpeg *.gif *.svg *.ico *.webp *.avif *.woff2 *.pdf
	header @static Cache-Control "public, max-age=31536000, immutable"
	@html path *.html /
	header @html Cache-Control "no-cache"
	file_server
}
# END ENDLICHYOGA
