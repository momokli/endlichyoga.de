# Drop-in for endlichyoga-deploy.service — installs as
# /etc/systemd/system/endlichyoga-deploy.service.d/deploy-repo.conf
# (deploy/provision.sh does this). Mirrors the mariusklimke.de drop-in:
# which repo/branch deploy.sh pulls from the environment.
[Service]
Environment=REPO=momokli/endlichyoga.de
Environment=BRANCH=built
