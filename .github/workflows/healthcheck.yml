name: Health Check

# Hourly availability check for https://endlichyoga.de and
# https://www.endlichyoga.de.
#
# On failure: opens a GitHub issue titled `⚠️ endlichyoga.de down …`
#             (only if no such open issue exists, so repeated failures do not
#             spam).
# On success: closes those issues again.
#
# No repository secrets required — uses only the built-in GITHUB_TOKEN
# (issues: write).
#
# Notes on the fixes in this file:
# - `gh` needs repository context. Without `actions/checkout` it aborts with
#   "fatal: not a git repository (or any of the parent directories): .git",
#   which used to fail the "Close issues on recovery" step on every run and
#   would also have broken downtime alerting.
# - Issues are matched by title prefix instead of the `healthcheck` label:
#   that label does not exist in this repository and `gh issue create
#   --label healthcheck` would have failed (labels are not auto-created).
# - Specifying `permissions:` resets all other scopes to `none`, so
#   `contents: read` is required for the checkout step.

on:
  schedule:
    # hourly at minute 17 (offset from the hour to avoid burst load)
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read # checkout (repo context for gh)
  issues: write # open/close downtime issues

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ISSUE_TITLE_PREFIX: "⚠️ endlichyoga.de down"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check endlichyoga.de
        id: check
        run: |
          set -euo pipefail
          FAILED=""
          for url in https://endlichyoga.de https://www.endlichyoga.de; do
            if curl -fsS --max-time 15 -o /dev/null "$url"; then
              echo "OK   $url"
            else
              echo "DOWN $url"
              FAILED="$FAILED $url"
            fi
          done
          echo "failed=${FAILED}" >> "$GITHUB_OUTPUT"
          echo "failed=${FAILED}"

      - name: Open downtime issue
        if: steps.check.outputs.failed != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOW="$(date -u +'%Y-%m-%d %H:%M UTC')"
          existing="$(gh issue list --state open --limit 100 --json title \
            --jq '[.[] | select(.title | contains("endlichyoga.de down"))] | length')"
          if [ "$existing" != "0" ]; then
            echo "open downtime issue already exists — not creating a duplicate"
            exit 0
          fi
          BODY="Health check (hourly workflow) failed at **$NOW** for:${{ steps.check.outputs.failed }} — [workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})."
          gh issue create \
            --title "$ISSUE_TITLE_PREFIX ($NOW)" \
            --body "$BODY"

      - name: Close issues on recovery
        if: steps.check.outputs.failed == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ISSUES="$(gh issue list --state open --limit 100 --json number,title \
            --jq '.[] | select(.title | contains("endlichyoga.de down")) | .number')"
          if [ -z "$ISSUES" ]; then
            echo "no open downtime issues"
            exit 0
          fi
          while read -r n; do
            echo "closing #$n"
            gh issue close "$n" --comment "✅ Website is reachable again (checked $(date -u +'%Y-%m-%d %H:%M UTC'))."
          done <<< "$ISSUES"
